<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista Negra Urban | Google Drive Sync</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/x-icon" href="https://img.icons8.com/color/96/000000/google-drive.png">
</head>
<body>
    <!-- Contenedor principal -->
    <div class="app-container">
        <!-- Header -->
        <header class="main-header">
            <h1 class="app-title">Gestión de Direcciones</h1>
            <p class="app-subtitle">Registro y control de deudas</p>
        </header>
        
        <!-- Barra de búsqueda -->
        <section class="search-container">
            <div class="search-box">
                <i class="fas fa-search search-icon"></i>
                <input type="text" class="search-input" id="searchInput" placeholder=" ">
                <span class="search-placeholder">Buscar por dirección o teléfono...</span>
            </div>
        </section>
        
        <!-- Contador total -->
        <div class="total-counter">
            <div class="total-label">Total</div>
            <div class="total-value" id="totalValue">1</div>
        </div>
        
        <!-- Lista de registros -->
        <section class="records-container" id="recordsContainer">
            <!-- Registro de ejemplo (igual a la captura) -->
            <div class="record-card fade-in">
                <div class="address-section">
                    <div class="section-label">DIRECCIÓN</div>
                    <div class="address-text">palacios 2098</div>
                </div>
                
                <div class="phones-section">
                    <div class="section-label">TELÉFONOS</div>
                    <div class="phones-list">
                        <div class="phone-item">
                            <i class="fas fa-phone phone-icon"></i>
                            <span class="phone-number">dsfsdf</span>
                        </div>
                    </div>
                </div>
                
                <div class="amount-section">
                    <div class="amount-label">MONTO IMPAGO</div>
                    <div class="amount-value">$ 43.434,00</div>
                </div>
                
                <div class="actions-section">
                    <button class="action-btn edit-btn" onclick="editRecord(1)">
                        <i class="fas fa-edit"></i>
                        <span>Editar</span>
                    </button>
                    <button class="action-btn delete-btn" onclick="deleteRecord(1)">
                        <i class="fas fa-trash"></i>
                        <span>Eliminar</span>
                    </button>
                </div>
            </div>
        </section>
        
        <!-- Footer -->
        <footer class="app-footer">
            <p>Sistema Lista Negra Urban | 
                <a href="https://base44.app" class="footer-link" target="_blank">Edit with Base44</a>
            </p>
        </footer>
    </div>
    
    <!-- Botón flotante para nuevo registro -->
    <button class="floating-button" id="newRecordBtn">
        <i class="fas fa-plus"></i>
    </button>
    
    <!-- Modal para nuevo registro -->
    <div class="modal-overlay" id="recordModal">
        <div class="modal-container">
            <div class="modal-header">
                <h2 class="modal-title">Nuevo Registro</h2>
            </div>
            
            <div class="modal-body">
                <form id="recordForm">
                    <!-- Dirección -->
                    <div class="form-section">
                        <label class="form-label">Dirección</label>
                        <input type="text" class="form-input" placeholder="Ingrese la dirección completa" required>
                    </div>
                    
                    <!-- Teléfonos -->
                    <div class="form-section">
                        <label class="form-label">Teléfonos de contacto</label>
                        <div id="phonesContainer">
                            <!-- Teléfonos se agregarán aquí -->
                        </div>
                        <button type="button" class="add-phone-btn" onclick="addPhoneField()">
                            <i class="fas fa-plus"></i>
                            <span>Agregar</span>
                        </button>
                        <div class="form-help">
                            <i class="fas fa-phone"></i>
                            <span>Ej: +54 11 1234-5678</span>
                        </div>
                    </div>
                    
                    <!-- Monto Impago -->
                    <div class="form-section">
                        <label class="form-label">Monto Impago</label>
                        <div class="amount-input-container">
                            <span class="currency-symbol">$</span>
                            <input type="number" class="amount-input" value="0.00" step="0.01" min="0" required>
                        </div>
                    </div>
                    
                    <!-- Notas -->
                    <div class="form-section">
                        <label class="form-label">Notas (opcional)</label>
                        <textarea class="form-textarea" placeholder="Observaciones adicionales"></textarea>
                    </div>
                </form>
            </div>
            
            <div class="modal-footer">
                <button class="submit-btn" onclick="saveRecord()">
                    <i class="fas fa-save"></i>
                    <span>Agregar Registro</span>
                </button>
            </div>
        </div>
    </div>
      <!-- Scripts -->
    <script src="js/app.js"></script>
 
</body>
</html>
